name: Compilar AURA

# Compila AURA.exe en un runner de Windows y lo deja como artefacto
# descargable. Mismos parametros que compilar.bat, para que el
# ejecutable sea identico al que sale en local.

on:
  workflow_dispatch:   # se lanza a mano desde la pestana Actions
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      # 3.12 y no 3.14: pythonnet (la dependencia de pywebview en
      # Windows) no siempre tiene ruedas para la ultima version de
      # Python en el momento de compilar.
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Mostrar versiones instaladas
        run: python -c "import webview, yt_dlp, mutagen; print('webview', webview.__version__); print('yt-dlp', yt_dlp.version.__version__); print('mutagen', mutagen.version_string)"

      - name: Compilar
        run: |
          python -m PyInstaller ^
            --onefile ^
            --windowed ^
            --name AURA ^
            --icon "assets\aura.ico" ^
            --add-data "frontend;frontend" ^
            --add-data "library;library" ^
            --add-data "assets;assets" ^
            "backend\main.py"

      - name: Subir AURA.exe
        uses: actions/upload-artifact@v4
        with:
          name: AURA-windows
          path: dist/AURA.exe
          if-no-files-found: error
